<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Main 4-pointed origami star -->
  <g filter="url(#starShadow)" transform="translate(45, 50) rotate(-15)">
    <!-- Facet 1 (Top-Left) -->
    <polygon points="0,0 -8,-35 0,-8" fill="#1e3a8a"/>
    <!-- Facet 2 (Top-Right) -->
    <polygon points="0,0 0,-8 15,-40" fill="#3b82f6"/>
    <!-- Facet 3 (Right-Top) -->
    <polygon points="0,0 8,-8 40,-12" fill="#2563eb"/>
    <!-- Facet 4 (Right-Bottom) -->
    <polygon points="0,0 8,8 35,15" fill="#60a5fa"/>
    <!-- Facet 5 (Bottom-Right) -->
    <polygon points="0,0 0,8 10,40" fill="#1d4ed8"/>
    <!-- Facet 6 (Bottom-Left) -->
    <polygon points="0,0 -8,8 -15,35" fill="#3b82f6"/>
    <!-- Facet 7 (Left-Bottom) -->
    <polygon points="0,0 -8,0 -38,10" fill="#2563eb"/>
    <!-- Facet 8 (Left-Top) -->
    <polygon points="0,0 -8,-8 -35,-15" fill="#60a5fa"/>
  </g>

  <!-- Secondary Smaller Star -->
  <g transform="translate(105, 30) scale(0.45) rotate(25)">
    <polygon points="0,0 -8,-35 0,-8" fill="#1e3a8a"/>
    <polygon points="0,0 0,-8 15,-40" fill="#3b82f6"/>
    <polygon points="0,0 8,-8 40,-12" fill="#2563eb"/>
    <polygon points="0,0 8,8 35,15" fill="#60a5fa"/>
    <polygon points="0,0 0,8 10,40" fill="#1d4ed8"/>
    <polygon points="0,0 -8,8 -15,35" fill="#3b82f6"/>
    <polygon points="0,0 -8,0 -38,10" fill="#2563eb"/>
    <polygon points="0,0 -8,-8 -35,-15" fill="#60a5fa"/>
  </g>

  <!-- Tiny Accent Star -->
  <g transform="translate(20, 85) scale(0.3) rotate(-35)">
    <polygon points="0,0 0,-30 8,0 0,30 -8,0" fill="#3b82f6"/>
    <polygon points="0,0 -30,0 0,8 30,0 0,-8" fill="#60a5fa"/>
  </g>
</svg>
