<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <!-- Origami Paper Boat -->
  <defs>
    <filter id="boatShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#boatShadow)">
    <!-- Base Hull Left -->
    <polygon points="10,85 100,105 50,115" fill="#1e293b" opacity="0.9"/>
    <!-- Base Hull Right -->
    <polygon points="190,85 100,105 150,115" fill="#334155" opacity="0.95"/>
    <!-- Center Hull Fold -->
    <polygon points="50,115 100,105 150,115 100,120" fill="#0f172a"/>
    <!-- Left Sail -->
    <polygon points="100,15 45,85 100,85" fill="#475569" opacity="0.95"/>
    <!-- Right Sail (Highlight) -->
    <polygon points="100,15 100,85 155,85" fill="#64748b" opacity="0.9"/>
    <!-- Center Peak Fold -->
    <polygon points="100,20 90,85 100,85" fill="#334155" opacity="0.4"/>
    <!-- Technical Compass Dial Watermark -->
    <circle cx="160" cy="95" r="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="160" y="99" font-size="8" font-family="monospace" font-weight="bold" fill="#94a3b8" text-anchor="middle" opacity="0.7">N</text>
  </g>
</svg>
