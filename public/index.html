<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quién quiere ser Ingeniero? - Hub Principal</title>
  
  <!-- Socket.IO CDN & Configuration -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/js/config.js"></script>

  <!-- Custom Styles & Icons -->
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/icons.js"></script>
</head>
<body class="gingham-pattern text-slate-800 flex flex-col min-h-screen relative select-none">

  <!-- Origami Stars (Top-Left Decor) -->
  <div class="decor-stars">
    <img src="/img/origami-stars.svg" alt="Estrellas Decorativas" style="width: 100%; height: 100%;">
  </div>

  <!-- Origami Boat (Bottom-Right Decor) -->
  <div class="decor-boat">
    <img src="/img/origami-boat.svg" alt="Barco Origami" style="width: 100%; height: 100%;">
  </div>

  <!-- Bottom Waves Trim -->
  <div class="decor-waves">
    <img src="/img/waves.svg" alt="Olas" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <!-- MAIN CONTAINER -->
  <main class="hub-container my-auto">
    
    <div class="denim-card denim-texture w-full shadow-2xl relative">
      
      <!-- Centered Header Area -->
      <div class="hub-header">
        <!-- Top Monogram -->
        <div class="logo-avatar">
          <img src="/img/logo-ceis.png" alt="Logo CEIS">
        </div>

        <!-- Main Title Ribbon -->
        <div class="ribbon-banner text-2xl md:text-3xl">
          ¿Quién quiere ser Ingeniero?
        </div>
        
        <p class="hub-subtitle">
          Selecciona tu acceso para ingresar al concurso:
        </p>
      </div>

      <!-- Roles Grid with High Contrast Cards -->
      <div class="roles-grid">
        
        <!-- 1. DISPLAY / PROYECCION -->
        <a href="/display.html" class="role-card-box group shadow-xl">
          <div>
            <div class="role-icon-box role-icon-blue" id="hubScreenIcon"></div>
            <h3 class="text-lg font-black text-white mb-1 group-hover:text-cyan-300 transition font-display">Proyección</h3>
            <p class="text-xs text-slate-300 font-medium">Pantalla para el auditorio y transmisión en vivo.</p>
          </div>
          <div class="mt-4 flex items-center gap-1 text-xs font-bold text-cyan-300 group-hover:translate-x-1 transition-transform">
            <span>Abrir Pantalla</span>
            <span id="hubArrow1"></span>
          </div>
        </a>

        <!-- 2. TEAMS / EQUIPOS -->
        <a href="/team.html" class="role-card-box group shadow-xl">
          <div>
            <div class="role-icon-box role-icon-green" id="hubPhoneIcon"></div>
            <h3 class="text-lg font-black text-white mb-1 group-hover:text-emerald-300 transition font-display">Equipos</h3>
            <p class="text-xs text-slate-300 font-medium">Pulsador y envío de respuestas por carrera.</p>
          </div>
          <div class="mt-4 flex items-center gap-1 text-xs font-bold text-emerald-300 group-hover:translate-x-1 transition-transform">
            <span>Ingresar</span>
            <span id="hubArrow2"></span>
          </div>
        </a>

        <!-- 3. ADMIN / JUEZ -->
        <a href="/admin.html" class="role-card-box group shadow-xl">
          <div>
            <div class="role-icon-box role-icon-amber" id="hubShieldIcon"></div>
            <h3 class="text-lg font-black text-white mb-1 group-hover:text-amber-300 transition font-display">Moderador</h3>
            <p class="text-xs text-slate-300 font-medium">Control de preguntas, cronómetro y puntajes.</p>
          </div>
          <div class="mt-4 flex items-center gap-1 text-xs font-bold text-amber-300 group-hover:translate-x-1 transition-transform">
            <span>Panel de Control</span>
            <span id="hubArrow3"></span>
          </div>
        </a>

      </div>

    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Icons) {
        document.getElementById('hubScreenIcon').innerHTML = Icons.screen("w-6 h-6");
        document.getElementById('hubPhoneIcon').innerHTML = Icons.smartphone("w-6 h-6");
        document.getElementById('hubShieldIcon').innerHTML = Icons.shield("w-6 h-6");
        document.getElementById('hubArrow1').innerHTML = Icons.chevronRight("w-4 h-4");
        document.getElementById('hubArrow2').innerHTML = Icons.chevronRight("w-4 h-4");
        document.getElementById('hubArrow3').innerHTML = Icons.chevronRight("w-4 h-4");
      }
    });
  </script>
</body>
</html>
